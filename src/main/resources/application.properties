# ═══════════════════════════════════════════════════════════════════════════════
#  Personalized Medicine AI — application.properties
#  All secrets/URLs that differ per environment should be overridden via
#  environment variables or a .env file (never committed).
# ═══════════════════════════════════════════════════════════════════════════════

# ── Application meta ─────────────────────────────────────────────────────────
quarkus.application.name=personalized-medicine-ai
quarkus.application.version=1.0.0-SNAPSHOT

# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.port=8080

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.smallrye-openapi.info-title=Personalized Medicine AI API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=GraphRAG + Bayesian Inference diagnostic endpoint
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ── Neo4j ─────────────────────────────────────────────────────────────────────
# Override these with env-vars in production:
#   QUARKUS_NEO4J_URI / QUARKUS_NEO4J_AUTHENTICATION_USERNAME / QUARKUS_NEO4J_AUTHENTICATION_PASSWORD
quarkus.neo4j.uri=bolt://localhost:7687
quarkus.neo4j.authentication.username=neo4j
quarkus.neo4j.authentication.password=medai-secret
# Connection pool settings (safe defaults for a PoC)
quarkus.neo4j.pool.max-connection-pool-size=10
quarkus.neo4j.pool.connection-acquisition-timeout=30S
quarkus.neo4j.pool.max-connection-lifetime=1H

# ── LangChain4j — Ollama (lokal, kein API-Key, keine Rate-Limits) ────────────
#
#  Voraussetzung: Ollama läuft lokal oder als Docker-Service.
#    Schnellstart:  docker compose -f docker/docker-compose.yml up -d
#    Das ollama-init-Service zieht phi3.5 beim ersten Start automatisch.
#
#  Ollama manuell installieren: https://ollama.com
#  Modell wechseln:  model-name auf llama3.2, mistral, etc. setzen
#
#  Fallback: Ist Ollama nicht erreichbar, generiert TemplateMedicalExplainer
#            automatisch eine deterministische deutsche Erklärung ohne LLM.
#
quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-name=phi3.5
quarkus.langchain4j.ollama.chat-model.temperature=0.3
quarkus.langchain4j.ollama.timeout=60S
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false
# Quarkus Dev Services für Ollama deaktivieren (wir nutzen Docker Compose)
quarkus.langchain4j.ollama.devservices.enabled=false

# ── Alternativ: Google AI Gemini (free-tier, Rate-Limits beachten) ───────────
#  1. quarkus-langchain4j-ai-gemini in pom.xml ergänzen
#  2. GEMINI_API_KEY in der Umgebung setzen
#  3. Ollama-Block oben auskommentieren, diesen aktivieren:
#
# quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:PLACEHOLDER}
# quarkus.langchain4j.ai.gemini.chat-model.model-name=gemini-2.0-flash
# quarkus.langchain4j.ai.gemini.chat-model.temperature=0.3
# quarkus.langchain4j.ai.gemini.chat-model.max-output-tokens=1024
# quarkus.langchain4j.ai.gemini.timeout=30S

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.promevity".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ─────────────────────────────────────────────────────────────────────────────
#  %dev profile  — used by `./mvnw quarkus:dev`
# ─────────────────────────────────────────────────────────────────────────────
%dev.quarkus.neo4j.uri=bolt://localhost:7687
%dev.quarkus.neo4j.authentication.password=medai-secret
%dev.quarkus.langchain4j.ollama.log-requests=true
%dev.quarkus.langchain4j.ollama.log-responses=true
%dev.quarkus.log.category."com.promevity".level=DEBUG

# ─────────────────────────────────────────────────────────────────────────────
#  %test profile — used by `./mvnw test` with Testcontainers
# ─────────────────────────────────────────────────────────────────────────────
# Neo4j connection is injected at runtime by the Neo4jTestResource (Testcontainers).
# MedicalExplainerPort is mocked via @InjectMock — Ollama wird nicht aufgerufen.
%test.quarkus.langchain4j.ollama.chat-model.model-name=phi3.5
%test.quarkus.langchain4j.ollama.base-url=http://localhost:11434
%test.quarkus.langchain4j.ollama.devservices.enabled=false
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.promevity".level=DEBUG
